name: macOS App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run desktop:package
      - run: npm run test:legacy
      - name: Zip macOS app with executable permissions and symlinks
        run: ditto -c -k --sequesterRsrc --keepParent 'release/MA3 Cue Remote-darwin-arm64/MA3 Cue Remote.app' release/MA3-Cue-Remote-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: MA3-Cue-Remote-macOS-arm64
          path: release/MA3-Cue-Remote-arm64.zip
          if-no-files-found: error
