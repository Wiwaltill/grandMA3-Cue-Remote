    <linearGradient id="line"><stop stop-color="#67dba0"/><stop offset="1" stop-color="#72a9ef"/></linearGradient>
  </defs>
  <rect width="1200" height="310" rx="20" fill="url(#bg)"/>
  <path d="M40 30h1120" stroke="#31433e"/>
